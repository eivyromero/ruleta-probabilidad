<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Ruleta de la Probabilidad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--felt-dark:#0a2f24;--gold:#cba135;--gold-bright:#e8c766;--cream:#f2e9d8;--line:rgba(203,161,53,0.25);}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(ellipse at 50% -10%,#163f31 0%,var(--felt-dark) 55%,#071f18 100%);
    font-family:'Inter',sans-serif;color:var(--cream);}
  .card{background:rgba(0,0,0,0.22);border:1px solid var(--line);border-radius:18px;padding:34px 28px;
    max-width:360px;width:100%;text-align:center;}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:26px;margin:0 0 6px;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  p.sub{font-size:12.5px;color:#a89f86;margin:0 0 22px;}
  input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,0.05);color:var(--cream);font-family:'Roboto Mono',monospace;font-size:15px;margin-bottom:14px;}
  button{width:100%;padding:14px;border:none;border-radius:999px;cursor:pointer;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1305;font-weight:800;font-size:15px;}
  .err{color:#e88a97;font-family:'Roboto Mono',monospace;font-size:12px;margin-bottom:12px;}
</style>
</head>
<body>
  <div class="card">
    <h1> Panel de Control</h1>
    <p class="sub">Ruleta de la Probabilidad · Casa Abierta</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST">
      <input type="password" name="password" placeholder="Contraseña" autofocus autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
